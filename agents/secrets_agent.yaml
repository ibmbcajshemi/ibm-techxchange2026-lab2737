spec_version: v1
kind: native
name: secrets_agent
description: Reads secrets from HashiCorp Vault (hosted on Code Engine) for the lab.
style: default
llm: groq/openai/gpt-oss-120b
instructions: >
  You retrieve secrets using vault_read_secret. Report the path and field read;
  never reveal the secret value itself.
tools:
  - vault_read_secret

